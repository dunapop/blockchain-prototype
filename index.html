<script>
(function(){
  const tooltip=document.getElementById('tooltip'),frame=document.getElementById('prototypeFrame'),navShell=document.getElementById('navShell'),collapseBtn=document.getElementById('collapseBtn'),expandFloatBtn=document.getElementById('expandFloatBtn');
  const notesToggleBtn=document.getElementById('notesToggleBtn'),notesExpandBtn=document.getElementById('notesExpandBtn'),notesEditor=document.getElementById('notesEditor'),notesPageLabel=document.getElementById('notesPageLabel'),notesPagePath=document.getElementById('notesPagePath');
  let activeNoteKey='';
  const defaultNotes={
  "prototype_note::pages/public/flow.html::public-flow": "页面定位：\n前端查询端业务流程说明页，用于向研发说明前端查询端的整体功能边界、查询路径与展示规则。\n\n页面功能：\n1. 仅保留身份证查询入口（姓名 + 身份证号）；不提供作品名称/著作权人查询。\n2. 查询结果仅以列表形式展示在身份证查询页下方，不跳转独立结果页。\n3. 结果列表字段：作品（缩略图 + 名称）、著作权人、证书编号。\n4. 不支持查看详情：不提供「查看详情」按钮、不打开详情弹窗。\n5. 说明证书编号展示规则：原始 SOP52044620 前缀替换为 CWS230519。\n\n页面流转：\n业务流程图 → 点击页面树「身份证查询」→ 进入身份证查询页 → 点击「查询」→ 在当前页下方展示列表结果。\n\n交互说明：\n本页为说明页，不参与实际数据提交；仅用于研发理解查询端功能边界与展示规则。",
  "prototype_note::pages/public/idcard-query.html::idcard-query": "页面定位：\n面向公众用户的身份证查询入口，用于按姓名 + 身份证号查询个人名下已完成存证/登记的作品。\n\n页面功能：\n1. 输入姓名（必填）。\n2. 输入身份证号（必填，建议做格式校验）。\n3. 点击「查询」后，系统按姓名 + 身份证号匹配著作权人并返回对应作品列表。\n4. 查询成功后，结果列表直接展示在查询区下方，不跳转到独立结果页。\n5. 查询无结果时展示无结果状态。\n\n查询结果展示（列表三列）：\n1. 作品：缩略图标注类型（图片/视频/其他） + 作品名称。\n2. 著作权人：多人时两人以内显示姓名，超过两人显示前两人加「等」。\n3. 证书编号：展示转换前缀后的存证证书号，原始 SOP52044620 → 展示 CWS230519，后续序号保持不变。\n\n交互说明：\n1. 前端查询端不提供「查看详情」按钮，不打开详情弹窗。\n2. 不展示登记进度时间线、证件附件、材料下载等后台能力。\n3. 查询端仅用于核验与列表展示，不做新增/编辑/上传/提交。\n\n页面流转：\n身份证查询页 → 点击查询 → 列表结果展示在同一页面下方，或展示无结果状态。",
  "prototype_note::pages/admin/flow.html::admin-flow": "页面定位：后台管理端业务流程说明页。后台拆分为两条独立业务线：区块链存证、版权登记。\n\n区块链存证：记录列表 → 新增存证 / 上传Excel / 上传作品 / 查看存证。\n版权登记：记录列表 → 新增登记 / 上传Excel / 批量上传资料 / 查看登记。\n\n两条业务线在菜单、列表、表单、弹窗和状态流转上独立管理。\n\n补充说明：区块链存证与版权登记为两条独立业务线；区块链存证菜单下不再出现存证后登记的场景。\n\n最新调整：区块链存证只上传作品文件，状态为待上传作品；版权登记保留上传资料，状态为待上传资料和待提交，并支持批量提交。",
  "prototype_note::pages/admin/login.html::login": "页面定位：\n后台管理端登录页，用于后台用户进入区块链版权登记系统。\n\n页面功能：\n1. 输入账号。\n2. 输入密码。\n3. 点击登录进入后台记录列表。\n4. 登录后顶部显示系统名称“区块链版权登记系统”和用户信息。\n5. 可通过退出按钮返回登录页。\n\n交互说明：\n1. 账号和密码为必填。\n2. 点击登录时需要做空值校验。\n3. 校验通过后进入记录列表页面。\n4. 登录失败时应提示账号或密码错误。\n5. 退出登录后清空登录状态并返回登录页。\n\n页面流转：\n登录页 → 点击登录 → 记录列表。\n记录列表 / 其他后台页 → 点击退出 → 登录页。",
  "prototype_note::pages/admin/cert-records.html::cert-records": "页面定位：\n区块链存证记录列表页，用于独立管理区块链存证业务。\n\n页面功能：\n1. 区块链存证只需要上传作品文件。\n2. 列表状态包括：待上传作品、待提交、存证中、已存证。\n3. 操作包括：新增存证、批量提交、上传Excel表格、上传作品、查看存证。\n4. 不涉及版权登记和登记材料。\n\n页面流转：\n区块链存证 → 新增存证。\n区块链存证 → 上传Excel表格弹窗。\n区块链存证 → 上传作品弹窗。\n区块链存证 → 查看存证弹窗。",
  "prototype_note::pages/admin/reg-records.html::add-record": "页面定位：\n后台统一新增页面，用于新增区块链存证，或新增区块链存证+版权登记。\n\n业务规则：\n1. 可以单独选择区块链存证。\n2. 不能单独选择版权登记。\n3. 勾选版权登记时，区块链存证自动选中并锁定，不能取消。\n4. 提交时系统根据所选类型提交对应业务数据。\n\n页面字段：\n一、作品基础信息：\n1. 作品名称。\n2. 资料文件。\n3. 存证方。\n\n二、区块链存证：\n1. 著作权人类型，默认自然人。\n2. 著作权人姓名 / 组织名称。\n3. 著作权人身份证号码 / 统一社会信用代码。\n\n三、版权登记：\n包含作品类型、作者名称、作者署名、权利保证书文件、其他材料文件、著作权人信息、企业法人信息、创作性质、权利拥有方式、作品归属情况、权利获得方式、作品创作说明、创作完成时间、创作完成地点、首次发表日期、发表地点等字段。\n\n交互说明：\n1. 选择区块链存证时，仅显示作品基础信息和区块链存证字段。\n2. 勾选版权登记时，显示版权登记字段，同时强制选中区块链存证。\n3. 著作权人为企业时，需要填写法人名称、法人身份证号码并上传法人身份证正反面。\n4. 点击保存后返回记录列表，状态为待提交。\n5. 点击提交后返回记录列表，并按业务类型更新存证状态和登记状态。",
  "prototype_note::pages/admin/cert-record-detail.html::cert-record-detail": "页面定位：区块链存证查看弹窗。\n\n交互说明：\n1. 列表操作按钮文案统一为“查看”。\n2. 弹窗展示作品与文件信息、区块链存证信息。\n3. 新增证书信息区，按电子数据存证证书展示证书编号、申请人/存证人、存证账号、数据指纹、文件数量、存证平台、授时时间、区块链ID、证据核验入口，并提供“下载证书”“下载可信时间戳”操作。",
  "prototype_note::pages/admin/reg-view.html::reg-record-detail": "页面定位：查看登记弹窗。\n\n交互说明：\n1. 弹窗同时展示版权登记信息和区块链存证信息，存证字段按电子数据存证证书口径展示。\n2. 当登记成功且已完成存证时，展示版权登记证书预览。\n3. 提供“下载证书”“下载可信时间戳”按钮。\n4. 驳回状态下额外展示驳回意见与处理建议。",
  "prototype_note::pages/admin/cert-excel-upload-modal.html::excel-upload-modal": "页面定位：\n后台上传Excel表格弹窗，用于批量导入存证或登记基础数据。\n\n页面功能：\n1. 选择操作类型：存证或登记。\n2. 下载对应模板。\n3. 上传Excel模板。\n4. 点击提交后解析Excel。\n5. 解析成功后，在记录列表生成数据，状态为待上传资料。\n\n交互说明：\n1. 操作类型为必选。\n2. 上传模板只接受Excel文件。\n3. 点击提交后关闭弹窗，并在记录列表显示导入数据。\n4. 导入数据不直接提交业务，只进入待上传资料状态。\n5. 后续需要继续上传资料文件。\n\n页面流转：\n记录列表 → 点击上传Excel表格 → 上传Excel表格弹窗。\n上传Excel表格弹窗 → 提交 → 记录列表，新增待上传资料数据。\n记录列表 → 上传资料 → 上传资料弹窗。",
  "prototype_note::pages/admin/reg-work-upload-modal.html::work-upload-modal": "页面定位：\n后台上传资料弹窗，用于上传与 Excel 表格数据匹配的作品文件和版权登记所需资料文件。\n\n资料类型代码：\n1. W：作品文件。\n2. G：权利保证书文件。\n3. M：其他材料文件。\n4. I：著作权人身份证或营业执照。\n\n上传标注规则：\n1. 每个资料文件都需要标注资料代码、资料名称、序号。\n2. 推荐文件命名格式：资料代码_资料名称_序号。\n3. 示例：W_蜀道山水图_01.jpg。\n4. 示例：G_蜀道山水图_01.pdf。\n5. 同一资料类型存在多个文件时，序号按 01、02、03 递增。\n\n交互说明：\n1. 由记录列表“批量上传资料”或“上传资料”按钮触发。\n2. 页面树也可直接打开该弹窗。\n3. 点击上传区域后展示已上传资料列表。\n4. 系统根据资料代码、名称和序号进行识别与归档。\n5. 点击提交后关闭弹窗，并将对应记录状态更新为待提交。\n\n页面流转：\n记录列表 → 批量上传资料 / 上传资料 → 上传资料弹窗。\n上传资料弹窗 → 提交 → 记录列表，状态更新为待提交。\n记录列表 → 勾选记录 → 批量提交。",
  "prototype_note::pages/admin/blockchain-cert.html::blockchain-cert": "页面定位：\n新增存证页面，用于新增一条区块链存证业务记录。\n\n页面字段：\n1. 作品名称。\n2. 作品文件。\n3. 存证方。\n4. 著作权人类型。\n5. 著作权人姓名 / 组织名称。\n6. 著作权人身份证号码 / 统一社会信用代码。\n\n交互说明：\n1. 保存后返回区块链存证列表，状态为待提交。\n2. 提交后进入存证中。\n3. 该页面只处理区块链存证，不涉及版权登记。",
  "prototype_note::pages/admin/cert-excel-upload-modal.html::cert-excel-upload-modal": "页面定位：\n区块链存证上传Excel表格弹窗，用于批量导入区块链存证基础数据。\n\n交互说明：\n1. 弹窗不需要操作类型。\n2. 字段为下载模板、上传表格。\n3. 上传框提示：点击上传Excel表格文件；仅支持.xlsx格式，提交后生成待上传作品记录。\n4. 从区块链存证列表点击“上传Excel表格”时，左侧页面树应定位到“区块链存证 / 上传Excel表格弹窗”。",
  "prototype_note::pages/admin/cert-work-upload-modal.html::cert-work-upload-modal": "页面定位：\n区块链存证上传作品弹窗，用于上传作品文件。\n\n代码规则：\n1. 作品文件代码为 W。\n2. 推荐命名格式：W_作品名称_序号。\n3. 示例：W_蜀道山水图_01.jpg。\n4. 多个作品文件按 01、02、03 递增。\n\n交互说明：\n点击上传后展示已上传作品文件，提交后记录状态更新为待提交。\n\n联动说明：从区块链存证列表点击“上传作品”时，左侧页面树应定位到“区块链存证 / 上传作品弹窗”。",
  "prototype_note::pages/admin/reg-records.html::reg-records": "页面定位：版权登记记录列表页。\n\n业务规则：\n1. 待上传资料：编辑 / 上传资料 / 删除。\n2. 待提交：编辑 / 提交 / 删除。\n3. 初审中、复审中、版权局审核中：查看。\n4. 登记完成：查看 / 下载登记证书 / 下载存证证书。\n5. 初审驳回、复审驳回、版权局审核驳回：查看 / 编辑 / 重新提交。",
  "prototype_note::pages/admin/new-registration.html::new-registration": "页面定位：\n新增登记页面，用于新增版权登记业务。\n\n作品基础信息：\n1. 作品名称。\n2. 作品文件。\n3. 存证方。\n\n版权登记字段：\n作品类型、作者名称、作者署名、权利保证书文件、其他材料文件、著作权人类型、著作权人名称、著作权人证件号码、著作权人身份证正反面或营业执照、法人名称、法人身份证号码、法人身份证正反面、创作性质、权利拥有方式、作品归属情况、权利获得方式、作品创作说明、创作完成时间、创作完成地点、首次发表日期、发表地点。\n\n交互说明：\n著作权人为企业时显示法人信息字段；保存后进入待提交，提交后进入登记流程。",
  "prototype_note::pages/admin/reg-excel-upload-modal.html::reg-excel-upload-modal": "页面定位：\n版权登记上传Excel表格弹窗，用于批量导入版权登记基础数据。\n\n交互说明：\n1. 弹窗不需要操作类型。\n2. 字段为下载模板、上传表格。\n3. 上传框提示：点击上传Excel表格文件；仅支持.xlsx格式，提交后生成待上传资料记录。\n4. 从版权登记列表点击“上传Excel表格”时，左侧页面树应定位到“版权登记 / 上传Excel表格弹窗”。",
  "prototype_note::pages/admin/reg-work-upload-modal.html::reg-work-upload-modal": "页面定位：\n版权登记上传资料弹窗，用于上传登记业务所需资料。\n\n资料代码：\n1. W：作品文件。\n2. G：权利保证书文件。\n3. M：其他材料文件。\n4. I：著作权人身份证或营业执照。\n\n上传规则：\n文件名需标注资料代码、资料名称、序号。推荐格式：资料代码_资料名称_序号，例如 W_蜀道山水图_01.jpg。\n\n联动说明：从版权登记列表点击“批量上传资料”或行内“上传资料”时，左侧页面树应定位到“版权登记 / 上传资料弹窗”。"
};
  function setTitle(title){const parts=(title||'').split('/').map(s=>s.trim()).filter(Boolean);if(parts.length)document.title=parts[parts.length-1]+' · 区块链版权登记项目原型';}
  function expandGroupByPage(page){const link=document.querySelector(`.tn[data-page="${page}"]`);if(!link)return;let group=link.closest('.tg');while(group){group.classList.add('open');group.style.maxHeight=group.scrollHeight+'px';const id=group.id.replace('tg-','');const btn=document.querySelector(`.toggle-mini[data-grp="${id}"]`);if(btn)btn.classList.add('open');group=group.parentElement&&group.parentElement.closest('.tg');}}
  function updateNotesForNode(node){
    const title=(node?.dataset.title||'').trim()||'未选择页面';
    if(notesPageLabel)notesPageLabel.textContent=title;
    if(notesPagePath)notesPagePath.textContent=title;
    activeNoteKey='prototype_note::'+(node?.dataset.file||'')+'::'+(node?.dataset.page||'');
    if(notesEditor){const saved=localStorage.getItem(activeNoteKey);notesEditor.value=saved!==null?saved:(defaultNotes[activeNoteKey]||'');}
  }
  function setActive(node){document.querySelectorAll('.tn').forEach(n=>n.classList.remove('act'));if(node){node.classList.add('act');setTitle(node.dataset.title||'');expandGroupByPage(node.dataset.page||'');updateNotesForNode(node);}}
  if(notesEditor){notesEditor.addEventListener('input',()=>{if(activeNoteKey)localStorage.setItem(activeNoteKey,notesEditor.value);});}
  document.querySelectorAll('.tn').forEach(node=>{const label=node.querySelector('.tl')?.textContent?.trim()||'';node.addEventListener('mouseenter',()=>{if(!navShell.classList.contains('tree-collapsed')&&label){tooltip.textContent=label;tooltip.style.display='block';}});node.addEventListener('mousemove',e=>{tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY+6)+'px';});node.addEventListener('mouseleave',()=>{tooltip.style.display='none';});node.addEventListener('click',e=>{if(node.classList.contains('folder-only')){const tg=document.getElementById(`tg-${node.dataset.folder}`);const btn=document.querySelector(`.toggle-mini[data-grp="${node.dataset.folder}"]`);if(tg&&!tg.classList.contains('open')&&btn)btn.click();e.preventDefault();return;}setActive(node);const href=node.getAttribute('href');if(frame&&href)frame.src=href;e.preventDefault();});});
  function refreshOpenAncestorHeights(el){let group=el&&el.parentElement&&el.parentElement.closest('.tg');while(group){if(group.classList.contains('open'))group.style.maxHeight=group.scrollHeight+'px';group=group.parentElement&&group.parentElement.closest('.tg');}}
  document.querySelectorAll('.toggle-mini').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();const tg=document.getElementById('tg-'+btn.dataset.grp);if(!tg)return;const open=tg.classList.toggle('open');tg.style.maxHeight=open?tg.scrollHeight+'px':'0';btn.classList.toggle('open',open);refreshOpenAncestorHeights(tg);});});
  collapseBtn.addEventListener('click',()=>{navShell.classList.toggle('tree-collapsed');tooltip.style.display='none';});
  if(expandFloatBtn){expandFloatBtn.addEventListener('click',()=>{navShell.classList.remove('tree-collapsed');tooltip.style.display='none';});}
  function toggleNotes(){navShell.classList.toggle('notes-collapsed');}
  if(notesToggleBtn)notesToggleBtn.addEventListener('click',toggleNotes);
  if(notesExpandBtn)notesExpandBtn.addEventListener('click',toggleNotes);
  window.addEventListener('message',e=>{const data=e.data||{};if(data.type!=='prototype:navigate')return;const target=document.querySelector(`.tn[data-file="${data.file}"][data-page="${data.page}"]`);if(target)setActive(target);});
  frame.addEventListener('load',()=>{
    try{
      const u=new URL(frame.contentWindow.location.href);
      const full=u.pathname+u.search;
      const target=[...document.querySelectorAll('.tn')].find(n=>{
        const href=n.getAttribute('href')||'';
        const file=n.dataset.file||'';
        return (href && (full.endsWith('/'+href) || full.endsWith(href)))
          || (file && (u.pathname.endsWith('/'+file) || u.pathname.endsWith(file)));
      });
      if(target)setActive(target);
    }catch(err){}
  });
  setActive(document.querySelector('.tn.act'));
})();
</script>
</body>
</html>
