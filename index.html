<script>
(function(){
  const tooltip=document.getElementById('tooltip'),frame=document.getElementById('prototypeFrame'),navShell=document.getElementById('navShell'),collapseBtn=document.getElementById('collapseBtn'),expandFloatBtn=document.getElementById('expandFloatBtn');
  const notesToggleBtn=document.getElementById('notesToggleBtn'),notesExpandBtn=document.getElementById('notesExpandBtn'),notesEditor=document.getElementById('notesEditor'),notesPageLabel=document.getElementById('notesPageLabel'),notesPagePath=document.getElementById('notesPagePath');
  let activeNoteKey='';
  const defaultNotes={
  "prototype_note::public-query.html::public-flow": "页面定位：\n前端查询端业务流程说明页，用于向研发说明前端查询端的整体查询路径、结果展示规则和详情弹窗分流逻辑。\n\n页面功能：\n1. 展示身份证查询、证书/存证查询两类入口的业务流程。\n2. 说明查询结果列表字段：作品名称、作品类别、创作者、存证编号、登记编号、操作。\n3. 说明前端查询端不展示登记状态，不提供新增、编辑、上传、提交等后台操作。\n4. 说明详情弹窗根据数据情况分为查看登记弹窗和查看存证弹窗。\n\n页面流转：\n1. 点击页面树“身份证查询”进入身份证查询页。\n2. 点击页面树“证书 / 存证查询”进入编号查询页。\n3. 点击页面树“查询结果示例”展示查询结果列表。\n4. 在查询结果中点击“查看详情”，如记录存在登记编号，进入查看登记弹窗；如仅存在存证编号，进入查看存证弹窗。\n\n交互说明：\n1. 本页为说明页，不参与实际数据提交。\n2. 仅用于研发理解查询端功能边界和页面流转规则。",
  "prototype_note::public-query.html::idcard-query": "页面定位：\n面向公众用户的身份证查询入口，用于按姓名和身份证号查询个人名下版权作品记录。\n\n页面功能：\n1. 用户输入姓名。\n2. 用户输入身份证号。\n3. 点击“查询”后，系统按证件信息检索对应版权作品。\n4. 查询成功后跳转/展示查询结果列表。\n5. 查询失败或无结果时展示无结果状态。\n\n交互说明：\n1. 姓名和身份证号均为查询条件，研发实现时需做必填校验。\n2. 身份证号建议做格式校验。\n3. 点击“查询”后调用查询接口。\n4. 查询结果返回后展示查询结果示例页结构。\n5. 无匹配数据时展示“未找到相关版权记录”。\n\n页面流转：\n身份证查询页 → 点击查询 → 查询结果示例页 / 无结果状态。\n查询结果示例页 → 点击查看详情 → 查看登记弹窗或查看存证弹窗。",
  "prototype_note::public-query.html::cert-query": "页面定位：\n面向公众用户的证书编号、存证编号或链上地址查询入口，用于精确核验某一条版权登记或区块链存证记录。\n\n页面功能：\n1. 用户输入登记证书编号、区块链存证编号或链上地址。\n2. 点击“查询”后，系统按编号进行精确匹配。\n3. 匹配到登记记录时展示登记详情。\n4. 匹配到存证记录时展示存证详情。\n5. 未匹配时展示无结果状态。\n\n交互说明：\n1. 输入框为必填。\n2. 查询按钮触发编号查询接口。\n3. 查询结果可能为版权登记记录、区块链存证记录，或二者都有。\n4. 结果页不展示登记状态，只展示登记编号和存证编号。\n5. 用户点击查看详情后，由数据字段决定弹窗类型。\n\n页面流转：\n证书/存证查询页 → 点击查询 → 查询结果示例页。\n查询结果示例页 → 点击查看详情 → 查看登记弹窗 / 查看存证弹窗。",
  "prototype_note::public-query.html::results": "页面定位：\n前端查询端的查询结果列表页，用于展示身份证查询或编号查询返回的版权作品记录。\n\n页面功能：\n1. 展示查询命中的版权记录数量。\n2. 列表展示字段：序号、作品名称、作品类别、创作者、存证编号、登记编号、操作。\n3. 已删除登记状态列，前端查询端不再直接展示“已登记 / 仅存证”状态。\n4. 每条记录提供“查看详情”按钮。\n\n交互说明：\n1. 点击“查看详情”时，根据记录数据判断弹窗类型。\n2. 如果记录存在登记编号，打开查看登记弹窗。\n3. 如果记录没有登记编号但存在存证编号，打开查看存证弹窗。\n4. 查询端仅用于查看与核验，不提供编辑、提交、上传等操作。\n\n页面流转：\n查询结果示例页 → 查看详情 → 查看登记弹窗。\n查询结果示例页 → 查看详情 → 查看存证弹窗。",
  "prototype_note::public-query.html::results-detail-registered": "页面定位：\n前端查询端的查看登记详情弹窗，用于展示已经完成版权登记的作品详情。\n\n页面功能：\n1. 展示作品基础信息：作品名称、作品类别、创作者、创作性质、完成日期等。\n2. 展示著作权人信息：权利人名称、权利人类型、证件类型、证件号码等。\n3. 展示权利拥有状况：权利范围、权利项。\n4. 展示登记信息：登记编号、登记机构、登记日期、证书信息。\n5. 如该作品同时完成区块链存证，可展示存证编号、TxHash、区块高度等链上信息。\n\n交互说明：\n1. 弹窗由查询结果列表“查看详情”触发。\n2. 点击关闭按钮或弹窗外区域关闭弹窗。\n3. 弹窗只读，不允许修改。\n4. 复制类按钮仅复制编号或链上 Hash。\n\n页面流转：\n查询结果示例页 → 点击查看详情 → 查看登记弹窗。\n查看登记弹窗 → 关闭 → 返回查询结果示例页。",
  "prototype_note::public-query.html::results-detail-certified": "页面定位：\n前端查询端的查看存证详情弹窗，用于展示仅完成区块链存证、尚未完成版权登记的作品详情。\n\n页面功能：\n1. 展示作品基础信息：作品名称、作品类别、创作者等。\n2. 展示区块链存证信息：存证编号、链平台、TxHash、区块高度、存证时间。\n3. 展示文件 Hash，用于核验资料文件与链上记录的一致性。\n4. 不展示版权登记证书信息。\n\n交互说明：\n1. 弹窗由查询结果列表“查看详情”触发。\n2. 当记录无登记编号但有存证编号时，进入该弹窗。\n3. 点击关闭按钮或弹窗外区域关闭弹窗。\n4. 弹窗只读，不允许修改或提交。\n\n页面流转：\n查询结果示例页 → 点击查看详情 → 查看存证弹窗。\n查看存证弹窗 → 关闭 → 返回查询结果示例页。",
  "prototype_note::admin-system.html::admin-flow": "页面定位：后台管理端业务流程说明页。后台拆分为两条独立业务线：区块链存证、版权登记。\n\n区块链存证：记录列表 → 新增存证 / 上传Excel / 上传作品 / 查看存证。\n版权登记：记录列表 → 新增登记 / 上传Excel / 批量上传资料 / 查看登记。\n\n两条业务线在菜单、列表、表单、弹窗和状态流转上独立管理。\n\n补充说明：区块链存证与版权登记为两条独立业务线；区块链存证菜单下不再出现存证后登记的场景。\n\n最新调整：区块链存证只上传作品文件，状态为待上传作品；版权登记保留上传资料，状态为待上传资料和待提交，并支持批量提交。",
  "prototype_note::admin-system.html::login": "页面定位：\n后台管理端登录页，用于后台用户进入区块链版权登记系统。\n\n页面功能：\n1. 输入账号。\n2. 输入密码。\n3. 点击登录进入后台记录列表。\n4. 登录后顶部显示系统名称“区块链版权登记系统”和用户信息。\n5. 可通过退出按钮返回登录页。\n\n交互说明：\n1. 账号和密码为必填。\n2. 点击登录时需要做空值校验。\n3. 校验通过后进入记录列表页面。\n4. 登录失败时应提示账号或密码错误。\n5. 退出登录后清空登录状态并返回登录页。\n\n页面流转：\n登录页 → 点击登录 → 记录列表。\n记录列表 / 其他后台页 → 点击退出 → 登录页。",
  "prototype_note::admin-system.html::cert-records": "页面定位：\n区块链存证记录列表页，用于独立管理区块链存证业务。\n\n页面功能：\n1. 区块链存证只需要上传作品文件。\n2. 列表状态包括：待上传作品、待提交、存证中、已存证。\n3. 操作包括：新增存证、批量提交、上传Excel表格、上传作品、查看存证。\n4. 不涉及版权登记和登记材料。\n\n页面流转：\n区块链存证 → 新增存证。\n区块链存证 → 上传Excel表格弹窗。\n区块链存证 → 上传作品弹窗。\n区块链存证 → 查看存证弹窗。",
  "prototype_note::admin-system.html::add-record": "页面定位：\n后台统一新增页面，用于新增区块链存证，或新增区块链存证+版权登记。\n\n业务规则：\n1. 可以单独选择区块链存证。\n2. 不能单独选择版权登记。\n3. 勾选版权登记时，区块链存证自动选中并锁定，不能取消。\n4. 提交时系统根据所选类型提交对应业务数据。\n\n页面字段：\n一、作品基础信息：\n1. 作品名称。\n2. 资料文件。\n3. 存证方。\n\n二、区块链存证：\n1. 著作权人类型，默认自然人。\n2. 著作权人姓名 / 组织名称。\n3. 著作权人身份证号码 / 统一社会信用代码。\n\n三、版权登记：\n包含作品类型、作者名称、作者署名、权利保证书文件、其他材料文件、著作权人信息、企业法人信息、创作性质、权利拥有方式、作品归属情况、权利获得方式、作品创作说明、创作完成时间、创作完成地点、首次发表日期、发表地点等字段。\n\n交互说明：\n1. 选择区块链存证时，仅显示作品基础信息和区块链存证字段。\n2. 勾选版权登记时，显示版权登记字段，同时强制选中区块链存证。\n3. 著作权人为企业时，需要填写法人名称、法人身份证号码并上传法人身份证正反面。\n4. 点击保存后返回记录列表，状态为待提交。\n5. 点击提交后返回记录列表，并按业务类型更新存证状态和登记状态。",
  "prototype_note::admin-system.html::cert-record-detail": "页面定位：区块链存证查看弹窗。\n\n交互说明：\n1. 列表操作按钮文案统一为“查看”。\n2. 弹窗展示作品与文件信息、区块链存证信息。\n3. 新增证书信息区，展示电子数据存证证书预览、证书状态、证书编号、发放日期，并提供“下载证书”“下载可信时间戳”操作。",
  "prototype_note::admin-system.html::reg-record-detail": "页面定位：查看登记弹窗。\n\n交互说明：\n1. 弹窗同时展示版权登记信息和区块链存证信息。\n2. 当登记成功且已完成存证时，展示版权登记证书预览。\n3. 提供“下载证书”“下载可信时间戳”按钮。\n4. 驳回状态下额外展示驳回意见与处理建议。",
  "prototype_note::admin-system.html::excel-upload-modal": "页面定位：\n后台上传Excel表格弹窗，用于批量导入存证或登记基础数据。\n\n页面功能：\n1. 选择操作类型：存证或登记。\n2. 下载对应模板。\n3. 上传Excel模板。\n4. 点击提交后解析Excel。\n5. 解析成功后，在记录列表生成数据，状态为待上传资料。\n\n交互说明：\n1. 操作类型为必选。\n2. 上传模板只接受Excel文件。\n3. 点击提交后关闭弹窗，并在记录列表显示导入数据。\n4. 导入数据不直接提交业务，只进入待上传资料状态。\n5. 后续需要继续上传资料文件。\n\n页面流转：\n记录列表 → 点击上传Excel表格 → 上传Excel表格弹窗。\n上传Excel表格弹窗 → 提交 → 记录列表，新增待上传资料数据。\n记录列表 → 上传资料 → 上传资料弹窗。",
  "prototype_note::admin-system.html::work-upload-modal": "页面定位：\n后台上传资料弹窗，用于上传与 Excel 表格数据匹配的作品文件和版权登记所需资料文件。\n\n资料类型代码：\n1. W：作品文件。\n2. G：权利保证书文件。\n3. M：其他材料文件。\n4. I：著作权人身份证或营业执照。\n\n上传标注规则：\n1. 每个资料文件都需要标注资料代码、资料名称、序号。\n2. 推荐文件命名格式：资料代码_资料名称_序号。\n3. 示例：W_蜀道山水图_01.jpg。\n4. 示例：G_蜀道山水图_01.pdf。\n5. 同一资料类型存在多个文件时，序号按 01、02、03 递增。\n\n交互说明：\n1. 由记录列表“批量上传资料”或“上传资料”按钮触发。\n2. 页面树也可直接打开该弹窗。\n3. 点击上传区域后展示已上传资料列表。\n4. 系统根据资料代码、名称和序号进行识别与归档。\n5. 点击提交后关闭弹窗，并将对应记录状态更新为待提交。\n\n页面流转：\n记录列表 → 批量上传资料 / 上传资料 → 上传资料弹窗。\n上传资料弹窗 → 提交 → 记录列表，状态更新为待提交。\n记录列表 → 勾选记录 → 批量提交。",
  "prototype_note::admin-system.html::blockchain-cert": "页面定位：\n新增存证页面，用于新增一条区块链存证业务记录。\n\n页面字段：\n1. 作品名称。\n2. 作品文件。\n3. 存证方。\n4. 著作权人类型。\n5. 著作权人姓名 / 组织名称。\n6. 著作权人身份证号码 / 统一社会信用代码。\n\n交互说明：\n1. 保存后返回区块链存证列表，状态为待提交。\n2. 提交后进入存证中。\n3. 该页面只处理区块链存证，不涉及版权登记。",
  "prototype_note::admin-system.html::cert-excel-upload-modal": "页面定位：\n区块链存证上传Excel表格弹窗，用于批量导入区块链存证基础数据。\n\n交互说明：\n1. 弹窗不需要操作类型。\n2. 字段为下载模板、上传表格。\n3. 上传框提示：点击上传Excel表格文件；仅支持.xlsx格式，提交后生成待上传作品记录。\n4. 从区块链存证列表点击“上传Excel表格”时，左侧页面树应定位到“区块链存证 / 上传Excel表格弹窗”。",
  "prototype_note::admin-system.html::cert-work-upload-modal": "页面定位：\n区块链存证上传作品弹窗，用于上传作品文件。\n\n代码规则：\n1. 作品文件代码为 W。\n2. 推荐命名格式：W_作品名称_序号。\n3. 示例：W_蜀道山水图_01.jpg。\n4. 多个作品文件按 01、02、03 递增。\n\n交互说明：\n点击上传后展示已上传作品文件，提交后记录状态更新为待提交。\n\n联动说明：从区块链存证列表点击“上传作品”时，左侧页面树应定位到“区块链存证 / 上传作品弹窗”。",
  "prototype_note::admin-system.html::reg-records": "页面定位：版权登记记录列表页。\n\n业务规则：\n1. 待上传资料状态提供“编辑、上传资料”。\n2. 待提交状态提供“编辑、提交”。\n3. 办理中、已登记并存证、已驳回可进入查看弹窗；已驳回同时支持编辑与重新提交。\n4. 列表展示存证编号和登记编号，最终状态为“已登记并存证”。",
  "prototype_note::admin-system.html::new-registration": "页面定位：\n新增登记页面，用于新增版权登记业务。\n\n作品基础信息：\n1. 作品名称。\n2. 作品文件。\n3. 存证方。\n\n版权登记字段：\n作品类型、作者名称、作者署名、权利保证书文件、其他材料文件、著作权人类型、著作权人名称、著作权人证件号码、著作权人身份证正反面或营业执照、法人名称、法人身份证号码、法人身份证正反面、创作性质、权利拥有方式、作品归属情况、权利获得方式、作品创作说明、创作完成时间、创作完成地点、首次发表日期、发表地点。\n\n交互说明：\n著作权人为企业时显示法人信息字段；保存后进入待提交，提交后进入登记流程。",
  "prototype_note::admin-system.html::reg-excel-upload-modal": "页面定位：\n版权登记上传Excel表格弹窗，用于批量导入版权登记基础数据。\n\n交互说明：\n1. 弹窗不需要操作类型。\n2. 字段为下载模板、上传表格。\n3. 上传框提示：点击上传Excel表格文件；仅支持.xlsx格式，提交后生成待上传资料记录。\n4. 从版权登记列表点击“上传Excel表格”时，左侧页面树应定位到“版权登记 / 上传Excel表格弹窗”。",
  "prototype_note::admin-system.html::reg-work-upload-modal": "页面定位：\n版权登记上传资料弹窗，用于上传登记业务所需资料。\n\n资料代码：\n1. W：作品文件。\n2. G：权利保证书文件。\n3. M：其他材料文件。\n4. I：著作权人身份证或营业执照。\n\n上传规则：\n文件名需标注资料代码、资料名称、序号。推荐格式：资料代码_资料名称_序号，例如 W_蜀道山水图_01.jpg。\n\n联动说明：从版权登记列表点击“批量上传资料”或行内“上传资料”时，左侧页面树应定位到“版权登记 / 上传资料弹窗”。"
};
  function setTitle(title){const parts=(title||'').split('/').map(s=>s.trim()).filter(Boolean);if(parts.length)document.title=parts[parts.length-1]+' · 区块链版权登记项目原型';}
  function expandGroupByPage(page){const link=document.querySelector(`.tn[data-page="${page}"]`);const group=link&&link.closest('.tg');if(group){group.classList.add('open');group.style.maxHeight='320px';const id=group.id.replace('tg-','');const btn=document.querySelector(`.toggle-mini[data-grp="${id}"]`);if(btn)btn.classList.add('open');}}
  function updateNotesForNode(node){
    const title=(node?.dataset.title||'').trim()||'未选择页面';
    if(notesPageLabel)notesPageLabel.textContent=title;
    if(notesPagePath)notesPagePath.textContent=title;
    activeNoteKey='prototype_note::'+(node?.dataset.file||'')+'::'+(node?.dataset.page||'');
    if(notesEditor){const saved=localStorage.getItem(activeNoteKey);notesEditor.value=saved!==null?saved:(defaultNotes[activeNoteKey]||'');}
  }
  function setActive(node){document.querySelectorAll('.tn').forEach(n=>n.classList.remove('act'));if(node){node.classList.add('act');setTitle(node.dataset.title||'');expandGroupByPage(node.dataset.page||'');updateNotesForNode(node);}}
  if(notesEditor){notesEditor.addEventListener('input',()=>{if(activeNoteKey)localStorage.setItem(activeNoteKey,notesEditor.value);});}
  document.querySelectorAll('.tn').forEach(node=>{const label=node.querySelector('.tl')?.textContent?.trim()||'';node.addEventListener('mouseenter',()=>{if(!navShell.classList.contains('tree-collapsed')&&label){tooltip.textContent=label;tooltip.style.display='block';}});node.addEventListener('mousemove',e=>{tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY+6)+'px';});node.addEventListener('mouseleave',()=>{tooltip.style.display='none';});node.addEventListener('click',()=>setActive(node));});
  document.querySelectorAll('.toggle-mini').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();const tg=document.getElementById('tg-'+btn.dataset.grp);if(!tg)return;const open=tg.classList.toggle('open');tg.style.maxHeight=open?'320px':'0';btn.classList.toggle('open',open);});});
  collapseBtn.addEventListener('click',()=>{navShell.classList.toggle('tree-collapsed');tooltip.style.display='none';});
  if(expandFloatBtn){expandFloatBtn.addEventListener('click',()=>{navShell.classList.remove('tree-collapsed');tooltip.style.display='none';});}
  function toggleNotes(){navShell.classList.toggle('notes-collapsed');}
  if(notesToggleBtn)notesToggleBtn.addEventListener('click',toggleNotes);
  if(notesExpandBtn)notesExpandBtn.addEventListener('click',toggleNotes);
  window.addEventListener('message',e=>{const data=e.data||{};if(data.type!=='prototype:navigate')return;const target=document.querySelector(`.tn[data-file="${data.file}"][data-page="${data.page}"]`);if(target)setActive(target);});
  frame.addEventListener('load',()=>{try{const url=new URL(frame.contentWindow.location.href);const page=(url.hash||'').replace('#','');const raw=url.pathname.split('/').pop();const file=raw.replace('-framed-v38','').replace('-framed','');const target=document.querySelector(`.tn[data-file="${file}"][data-page="${page}"]`);if(target)setActive(target);}catch(err){}});
  setActive(document.querySelector('.tn.act'));
})();
</script>
</body>
</html>
